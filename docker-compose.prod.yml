# Production-style stack: Postgres + migrations + API + web (nginx).
#   cp .env.example .env   # set SESSION_SECRET, DASHBOARD_PASSWORD, tokens, POSTGRES_PASSWORD
#   docker compose -f docker-compose.prod.yml up -d --build
# Open http://localhost:${WEB_PORT:-8080}. Put a TLS-terminating proxy in front for real use.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: mrdash
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d mrdash']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
      target: build
    command: ['pnpm', 'db:migrate:deploy']
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@postgres:5432/mrdash
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      TRUST_PROXY_HOPS: 1 # nginx; raise to 2 if a TLS proxy sits in front of it
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@postgres:5432/mrdash
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:8080'
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
