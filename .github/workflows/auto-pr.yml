name: Auto PR

on:
  push:
    branches: ['claude/**']

concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open PR for Claude branch (if none exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          existing=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "PR #$existing already exists for $BRANCH"
            exit 0
          fi
          issue=$(echo "$BRANCH" | sed -nE 's#^claude/issue-([0-9]+)-.*#\1#p')
          if [ -n "$issue" ]; then
            title=$(gh issue view "$issue" --repo "$REPO" --json title --jq .title)
            body=$(printf 'Closes #%s\n\nOpened automatically from `%s`. The phase report is on issue #%s.' "$issue" "$BRANCH" "$issue")
          else
            title="Claude: $BRANCH"
            body=$(printf 'Opened automatically from `%s`.' "$BRANCH")
          fi
          gh pr create --repo "$REPO" --head "$BRANCH" --base main --title "$title" --body "$body"
