name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Claude branches are already checked by the push run; skip the duplicate PR run
    if: github.event_name == 'push' || !startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: mrdash
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      CI: "true"
      DATABASE_URL: postgresql://app:app@localhost:5432/mrdash
      DATABASE_URL_TEST: postgresql://app:app@localhost:5432/mrdash_test
      APP_TIMEZONE: Asia/Yerevan
      SESSION_SECRET: ci-only-not-a-real-secret-0123456789abcdef
      GITLAB_WEBHOOK_SECRET: ci-gitlab-secret
      GITHUB_WEBHOOK_SECRET: ci-github-secret
    steps:
      - uses: actions/checkout@v6
      - id: exists
        run: |
          if [ -f pnpm-lock.yaml ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "No project yet, skipping."; fi
      - if: steps.exists.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - if: steps.exists.outputs.ok == 'true'
        run: npm install -g pnpm@9
      - if: steps.exists.outputs.ok == 'true'
        run: PGPASSWORD=app psql -h localhost -U app -d mrdash -c "CREATE DATABASE mrdash_test;"
      - if: steps.exists.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.exists.outputs.ok == 'true'
        run: pnpm run --if-present db:migrate:deploy
      - if: steps.exists.outputs.ok == 'true'
        run: pnpm run --if-present lint
      - if: steps.exists.outputs.ok == 'true'
        run: pnpm run --if-present typecheck
      - if: steps.exists.outputs.ok == 'true'
        run: pnpm run --if-present test
      - if: steps.exists.outputs.ok == 'true'
        run: pnpm run --if-present build
