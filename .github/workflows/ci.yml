name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: mrdash
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      CI: "true"
      DATABASE_URL: postgresql://app:app@localhost:5432/mrdash
      DATABASE_URL_TEST: postgresql://app:app@localhost:5432/mrdash_test
      APP_TIMEZONE: Asia/Yerevan
      SESSION_SECRET: ci-only-not-a-real-secret-0123456789abcdef
      GITLAB_WEBHOOK_SECRET: ci-gitlab-secret
      GITHUB_WEBHOOK_SECRET: ci-github-secret

    steps:
      - uses: actions/checkout@v6

      - name: Skip until the project exists
        id: exists
        run: |
          if [ -f pnpm-lock.yaml ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "No project yet, skipping."; fi

      - uses: actions/setup-node@v4
        if: steps.exists.outputs.ok == 'true'
        with:
          node-version: 20

      - name: Install pnpm
        if: steps.exists.outputs.ok == 'true'
        run: npm install -g pnpm@9

      - name: Create test database
        if: steps.exists.outputs.ok == 'true'
        run: PGPASSWORD=app psql -h localhost -U app -d mrdash -c "CREATE DATABASE mrdash_test;"

      - name: Install
        if: steps.exists.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile

      - name: Migrate
        if: steps.exists.outputs.ok == 'true'
        run: pnpm run --if-present db:migrate:deploy

      - name: Lint
        if: steps.exists.outputs.ok == 'true'
        run: pnpm run --if-present lint

      - name: Typecheck
        if: steps.exists.outputs.ok == 'true'
        run: pnpm run --if-present typecheck

      - name: Test
        if: steps.exists.outputs.ok == 'true'
        run: pnpm run --if-present test

      - name: Build
        if: steps.exists.outputs.ok == 'true'
        run: pnpm run --if-present build
