<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MR &amp; Task Dashboard</title>
    <script>
      // Apply the saved theme before first paint so there is no flash. Keep in sync with lib/theme.ts.
      (function () {
        try {
          var pref = localStorage.getItem('mrdash.theme');
          var dark =
            !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = pref === 'light' || pref === 'dark' ? pref : dark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
